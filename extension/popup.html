<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>url2regex</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>url2regex</h1>
  <form id="generator">
    <label for="urls">URLs or paths, one per line</label>
    <textarea id="urls" rows="7" placeholder="https://example.com/a&#10;https://example.com/a/b" required></textarea>
    <label><input id="paths" type="checkbox"> Extract paths only</label>
    <button type="submit">Generate regex</button>
  </form>
  <p id="status" role="status" aria-live="polite"></p>
  <label for="result">Pattern — select and copy</label>
  <textarea id="result" rows="5" readonly></textarea>
  <p>Processed in this popup. Nothing is sent to a server.</p>
  <script type="module" src="popup.js"></script>
</body>
</html>
