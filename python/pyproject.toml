[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "url2regex"
version = "0.1.0"
description = "Generate compact regular expressions from lists of URLs or paths."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []

[project.urls]
Repository = "https://github.com/mertefeisawesome/url2regex"
Issues = "https://github.com/mertefeisawesome/url2regex/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["url2regex*"]
