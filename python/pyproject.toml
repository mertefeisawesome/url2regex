[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "url2regex"
version = "0.1.0.dev0"
description = "Generate compact regular expressions from lists of URLs or paths."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
include = ["url2regex*"]
